    <link rel="icon" type="image/png" href="/images/logo/favicon.png" />
    <link rel="apple-touch-icon" href="/images/logo/favicon.png" />
    <!-- TODO(deploy): añadir <link rel="canonical">, <meta property="og:url"> y og:image / twitter:image cuando exista el dominio y los assets reales (Fase 3). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="El Rey Del Lápiz" />
    <meta property="og:title" content="El Rey Del Lápiz — Caricaturas en Vivo para Eventos" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes sin bloquear el render: se cargan como "print" y se aplican al terminar
         (onload). Con `display=swap` el texto se ve al instante en la fuente de sistema y
         cambia a Bangers/Nunito al cargar. `<noscript>` mantiene las fuentes sin JS. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap"
      />
    </noscript>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
